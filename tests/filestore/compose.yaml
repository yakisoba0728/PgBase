services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: pgbase-test-access
      MINIO_ROOT_PASSWORD: pgbase-test-secret-0123456789
    ports:
      - "127.0.0.1:${PGBASE_TEST_S3_HOST_PORT:-59000}:9000"
  create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c '
      for attempt in $$(seq 1 60); do
        if mc alias set local http://minio:9000 pgbase-test-access pgbase-test-secret-0123456789; then break; fi;
        sleep 1;
      done;
      mc mb --ignore-existing local/pgbase-test
      '
