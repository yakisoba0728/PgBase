# MinIO RELEASE.2025-07-23T15-54-02Z and mc RELEASE.2025-07-21T05-28-08Z,
# built from their pinned upstream commits by ./Dockerfile because the
# upstream images are no longer anonymously pullable. Compose builds the image
# when it is missing; scripts/test-s3-fixture.sh also rebuilds it whenever
# the Dockerfile changes, so an edited Dockerfile cannot leave a stale image.
services:
  minio:
    build: .
    image: pgbase-test-s3:minio-RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: pgbase-test-access
      MINIO_ROOT_PASSWORD: pgbase-test-secret-0123456789
    ports:
      - "127.0.0.1:${PGBASE_TEST_S3_HOST_PORT:-59000}:9000"
  create-bucket:
    build: .
    image: pgbase-test-s3:minio-RELEASE.2025-07-23T15-54-02Z
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c '
      for attempt in $$(seq 1 60); do
        if mc alias set local http://minio:9000 pgbase-test-access pgbase-test-secret-0123456789; then break; fi;
        sleep 1;
      done;
      mc mb --ignore-existing local/pgbase-test
      '
