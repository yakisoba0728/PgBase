name: Release phase image gate

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: Exact rollout name from deployments/release-phases.json
        required: true
        type: string
      phase:
        description: Exact phase name within the selected rollout
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-phase-${{ inputs.rollout }}-${{ inputs.phase }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.artifact.outputs.source_commit }}
      expected_version: ${{ steps.artifact.outputs.expected_version }}
    steps:
      - name: Check out the release phase manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve one immutable release phase
        id: artifact
        shell: bash
        env:
          ROLLOUT: ${{ inputs.rollout }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          matches="$(jq --compact-output \
            --arg rollout "$ROLLOUT" \
            --arg phase "$PHASE" \
            '[.rollouts[] | select(.name == $rollout) | .artifacts[] | select(.phase == $phase)]' \
            deployments/release-phases.json)"
          count="$(jq 'length' <<< "$matches")"
          if [[ "$count" != "1" ]]; then
            echo "release phase must resolve exactly once: rollout=$ROLLOUT phase=$PHASE matches=$count" >&2
            exit 2
          fi
          source_commit="$(jq --exit-status --raw-output \
            '.[0].commit | strings | select(test("^[0-9a-f]{40}$"))' <<< "$matches")"
          expected_version="$(jq --exit-status --raw-output \
            '.[0].version | strings | select(length > 0)' <<< "$matches")"
          scripts/support/release-tag-policy.sh "$expected_version" "$expected_version" >/dev/null
          git cat-file -e "$source_commit^{commit}"
          if ! git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"; then
            echo "selected release phase is not an ancestor of the dispatched revision" >&2
            exit 2
          fi
          {
            echo "source_commit=$source_commit"
            echo "expected_version=$expected_version"
          } >> "$GITHUB_OUTPUT"

  candidate:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-publish
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    outputs:
      candidate_image: ${{ steps.candidate.outputs.candidate_image }}
      image: ${{ steps.candidate.outputs.image }}
      digest: ${{ steps.candidate.outputs.digest }}
      binary_digest: ${{ steps.candidate.outputs.binary_digest }}
    steps:
      - name: Check out the gate and full artifact history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the pinned artifact toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: true
          cache-dependency-path: go.sum

      - name: Install the pinned private attestation verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Require a private package before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/support/validate-private-package.sh before \
            "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REPOSITORY#*/}" \
            "$RUNNER_TEMP/package-privacy-before.json"

      - name: Build the immutable release phase bundle
        env:
          RELEASE_PHASE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/release-phase-artifacts
        run: |
          scripts/support/build-release-phase-artifacts.sh record-membership-v7 \
            "$RELEASE_PHASE_ARTIFACT_DIRECTORY"
          scripts/support/build-release-phase-artifacts.sh schema-compiler-v9 \
            "$RELEASE_PHASE_ARTIFACT_DIRECTORY"

      - name: Run the current composite rollout oracle against the candidate bundle
        env:
          PGBASE_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          PGBASE_MEMBERSHIP_RELEASE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/release-phase-artifacts
          PGBASE_SCHEMA_COMPILER_RELEASE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/release-phase-artifacts
        run: go test -race -tags='integration releaseartifacts' ./tests/release -count=1

      - name: Package and push the tested phase candidate once
        id: candidate
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PHASE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/release-phase-artifacts
          ROLLOUT: ${{ inputs.rollout }}
          PHASE: ${{ inputs.phase }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.expected_version }}
        run: |
          set -euo pipefail
          artifact_directory="$RELEASE_PHASE_ARTIFACT_DIRECTORY"
          packaging_context="$RUNNER_TEMP/release-phase-package"
          metadata="$artifact_directory/$ROLLOUT-artifacts.json"
          selected="$(jq --exit-status --compact-output --arg phase "$PHASE" \
            '[.artifacts[] | select(.phase == $phase)] | select(length == 1) | .[0]' "$metadata")"
          test "$(jq --raw-output '.commit' <<< "$selected")" = "$SOURCE_COMMIT"
          test "$(jq --raw-output '.version' <<< "$selected")" = "$EXPECTED_VERSION"
          artifact_path="$(jq --exit-status --raw-output '.path | select(test("^[A-Za-z0-9._-]+$"))' <<< "$selected")"
          binary_digest="$(jq --exit-status --raw-output '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$selected")"
          test "sha256:$(sha256sum "$artifact_directory/$artifact_path" | awk '{print $1}')" = "$binary_digest"
          mkdir "$packaging_context"
          install -m 0755 "$artifact_directory/$artifact_path" "$packaging_context/pgbase"
          image="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          candidate_tag="phase-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          metadata_file="$RUNNER_TEMP/phase-candidate-metadata.json"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create \
            --use \
            --name "pgbase-phase-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --driver docker-container \
            --driver-opt "image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8"
          docker buildx build \
            --file deployments/release-phase.Dockerfile \
            --platform linux/amd64 \
            --build-arg "SOURCE_COMMIT=$SOURCE_COMMIT" \
            --build-arg "VERSION=$EXPECTED_VERSION" \
            --tag "$image:$candidate_tag" \
            --metadata-file "$metadata_file" \
            --provenance=mode=max \
            --sbom=true \
            --push "$packaging_context"
          digest="$(jq --exit-status --raw-output \
            '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata_file")"
          candidate_image="$image@$digest"
          scripts/support/validate-release-candidate.sh "$candidate_image" "$EXPECTED_VERSION"
          {
            echo "candidate_image=$candidate_image"
            echo "image=$image"
            echo "digest=$digest"
            echo "binary_digest=$binary_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Generate phase candidate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.candidate.outputs.candidate_image }}
          format: spdx-json
          output-file: pgbase-release-phase.spdx.json
          artifact-name: pgbase-release-phase-sbom

      - name: Describe the key-backed phase build
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.expected_version }}
        run: scripts/support/create-release-provenance.sh "$RUNNER_TEMP/release-provenance.json" "$EXPECTED_VERSION" "${{ needs.resolve.outputs.source_commit }}"

      # The SLSA provenance binds this historical source commit to the build.
      # This additional predicate records its rollout phase and binary digest.
      - name: Describe the selected phase source
        shell: bash
        env:
          ROLLOUT: ${{ inputs.rollout }}
          PHASE: ${{ inputs.phase }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.expected_version }}
          BINARY_DIGEST: ${{ steps.candidate.outputs.binary_digest }}
        run: |
          set -euo pipefail
          jq --null-input \
            --arg rollout "$ROLLOUT" \
            --arg phase "$PHASE" \
            --arg repository "https://github.com/$GITHUB_REPOSITORY" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg workflowCommit "$GITHUB_SHA" \
            --arg version "$EXPECTED_VERSION" \
            --arg binaryDigest "$BINARY_DIGEST" \
            '{schemaVersion: 1, rollout: $rollout, phase: $phase, source: {repository: $repository, commit: $sourceCommit}, packaging: {workflowCommit: $workflowCommit}, version: $version, binaryDigest: $binaryDigest}' \
            > "$RUNNER_TEMP/release-phase-source.json"

      - name: Sign the phase provenance, SBOM, and selected source
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.expected_version }}
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.candidate_image }}
        run: |
          scripts/support/sign-release-attestation.sh "$CANDIDATE_IMAGE" slsaprovenance1 "$RUNNER_TEMP/release-provenance.json"
          scripts/support/sign-release-attestation.sh "$CANDIDATE_IMAGE" spdxjson pgbase-release-phase.spdx.json
          scripts/support/sign-release-attestation.sh "$CANDIDATE_IMAGE" https://github.com/yakisoba0728/PgBase/attestations/release-phase/v1 "$RUNNER_TEMP/release-phase-source.json"

      - name: Verify every signed phase attestation against the candidate digest
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.candidate_image }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.expected_version }}
        run: |
          set -euo pipefail
          scripts/support/verify-release-attestation.sh "$CANDIDATE_IMAGE" slsaprovenance1 \
            "$RUNNER_TEMP/release-provenance.json" .github/cosign.pub "$RUNNER_TEMP/phase-attestation-provenance.json"
          scripts/support/verify-release-attestation.sh "$CANDIDATE_IMAGE" spdxjson \
            pgbase-release-phase.spdx.json .github/cosign.pub "$RUNNER_TEMP/phase-attestation-sbom.json"
          scripts/support/verify-release-attestation.sh "$CANDIDATE_IMAGE" https://github.com/yakisoba0728/PgBase/attestations/release-phase/v1 \
            "$RUNNER_TEMP/release-phase-source.json" .github/cosign.pub "$RUNNER_TEMP/phase-attestation-source.json"

      - name: Require the published package to remain private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/support/validate-private-package.sh after \
            "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REPOSITORY#*/}" \
            "$RUNNER_TEMP/package-privacy-after.json"

      - name: Upload phase attestation verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-phase-attestation-verification
          path: |
            ${{ runner.temp }}/phase-attestation-*.json
            ${{ runner.temp }}/release-phase-source.json
            ${{ runner.temp }}/package-privacy-*.json
          if-no-files-found: warn
          retention-days: 90

  gate:
    needs: [resolve, candidate]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/release-gate.yml
    with:
      candidate_image: ${{ needs.candidate.outputs.candidate_image }}
      expected_version: ${{ needs.resolve.outputs.expected_version }}
      source_commit: ${{ needs.resolve.outputs.source_commit }}
