name: Refactor full validation launcher

# Temporary launcher for this owner-authorized branch. No repository code is
# executed, no deployment/release workflow is invoked, and no content is written.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  launch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/independent-platform-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      WORK_BRANCH: refactor/independent-platform-20261116
    steps:
      - name: Launch existing isolated validation workflows for explicit candidate commits
        shell: bash
        run: |
          set -euo pipefail
          message="$(gh api "repos/$REPOSITORY/commits/$EXPECTED_HEAD" --jq '.commit.message')"
          if [[ "$message" != 'verify: full candidate'* ]]; then
            echo 'Not a full-validation candidate; routine PR checks remain active.'
            exit 0
          fi
          for workflow in backend.yml security.yml e2e.yml; do
            current="$(gh api "repos/$REPOSITORY/git/ref/heads/$WORK_BRANCH" --jq '.object.sha')"
            test "$current" = "$EXPECTED_HEAD"
            gh api --method POST "repos/$REPOSITORY/actions/workflows/$workflow/dispatches" -f "ref=$WORK_BRANCH"
            printf 'Dispatched %s for branch head %s\n' "$workflow" "$EXPECTED_HEAD"
          done
