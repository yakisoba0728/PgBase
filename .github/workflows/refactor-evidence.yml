name: Refactor evidence

# Temporary evidence transport for the independent-platform workstream.
# No publication, deployment, secrets, or repository write permission.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: refactor-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/independent-platform-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgbase-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/pgbase-evidence/source-commit.txt"
          git archive --format=tar --prefix=PgBase/ HEAD | gzip -n > "$RUNNER_TEMP/pgbase-evidence/source.tar.gz"
          cd "$RUNNER_TEMP/pgbase-evidence"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refactor-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pgbase-evidence/
          retention-days: 3
          if-no-files-found: error

  administrator-build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/independent-platform-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json
      - name: Build and test administrator UI
        working-directory: ui/admin
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          rm -rf dist
          npm run build
      - name: Package reproducible UI output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pgbase-ui-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/pgbase-ui-evidence/source-commit.txt"
          tar -czf "$RUNNER_TEMP/pgbase-ui-evidence/admin-dist.tar.gz" ui/admin/dist
          cd "$RUNNER_TEMP/pgbase-ui-evidence"
          sha256sum admin-dist.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refactor-admin-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pgbase-ui-evidence/
          retention-days: 3
          if-no-files-found: error
