name: Refactor candidate preparation

# Temporary, exact-branch-only build transport. The build has read-only
# permission. The separate writer only applies allowlisted non-executable files.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: refactor-preparation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/independent-platform-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json
      - name: Apply reviewed independent-product wording
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              'en': {
                  '"schema.compatibilityName": "Compatibility name"': '"schema.compatibilityName": "API alias"',
                  '"schema.compatibilityHint": "Optional PocketBase-style alias for the API."': '"schema.compatibilityHint": "Optional legacy alias for the collection API."',
                  '"schema.mode.pocketbase": "PocketBase compatible"': '"schema.mode.pocketbase": "Legacy compatibility"',
                  '"schema.recordId.text": "Text (PocketBase style)"': '"schema.recordId.text": "Text identifier"',
              },
              'ko': {
                  '"schema.compatibilityName": "호환 이름"': '"schema.compatibilityName": "API 별칭"',
                  '"schema.compatibilityHint": "API용 PocketBase 방식 별칭 (선택)"': '"schema.compatibilityHint": "컬렉션 API용 레거시 별칭 (선택)"',
                  '"schema.mode.pocketbase": "PocketBase 호환"': '"schema.mode.pocketbase": "레거시 호환"',
                  '"schema.recordId.text": "텍스트 (PocketBase 방식)"': '"schema.recordId.text": "텍스트 식별자"',
              },
          }
          for language, edits in replacements.items():
              path = Path(f'ui/admin/src/i18n/{language}.ts')
              text = path.read_text()
              for old, new in edits.items():
                  if new in text:
                      continue
                  if text.count(old) != 1:
                      raise SystemExit(f'Unexpected source: {language}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
      - name: Verify transport and product wording
        working-directory: ui/admin
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test -- src/api/http.test.ts src/api/http.lifecycle.test.ts src/api/session.test.ts src/i18n/identity.test.ts
      - name: Build embedded administrator assets
        working-directory: ui/admin
        run: |
          rm -rf dist
          npm run build
      - name: Package the bounded candidate patch
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pgbase-candidate"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-commit.txt"
          git add -- ui/admin/src/i18n/en.ts ui/admin/src/i18n/ko.ts ui/admin/dist
          git diff --cached --no-renames --binary > "$out/candidate.patch"
          git diff --cached --stat
          cd "$out"
          sha256sum candidate.patch source-commit.txt > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refactor-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pgbase-candidate/
          retention-days: 3
          if-no-files-found: error
  commit-generated:
    needs: prepare
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/independent-platform-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      WORK_BRANCH: refactor/independent-platform-20261116
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refactor-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pgbase-candidate
      - name: Validate and stage without executing patch contents
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgbase-candidate"
          sha256sum --check SHA256SUMS
          test "$(cat source-commit.txt)" = "$EXPECTED_HEAD"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import os, pathlib, subprocess
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pgbase-candidate/candidate.patch'
          if patch.stat().st_size > 30_000_000:
              raise SystemExit('Candidate patch exceeds transport budget')
          if not patch.stat().st_size:
              raise SystemExit(0)
          allowed = {'ui/admin/src/i18n/en.ts', 'ui/admin/src/i18n/ko.ts'}
          stats = subprocess.check_output(['git', 'apply', '--numstat', '-z', str(patch)]).decode()
          paths = []
          for entry in stats.split('\0'):
              if not entry:
                  continue
              path = entry.split('\t', 2)[2]
              if '..' in pathlib.PurePosixPath(path).parts or path.startswith('/') or not (path in allowed or path.startswith('ui/admin/dist/')):
                  raise SystemExit(f'Unapproved generated path: {path}')
              paths.append(path)
          if len(paths) > 1000:
              raise SystemExit('Too many generated paths')
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          for entry in subprocess.check_output(['git', 'ls-files', '--stage', '-z', '--', *paths]).decode().split('\0'):
              if entry and not entry.startswith('100644 '):
                  raise SystemExit('Generated symlinks or executable files are forbidden')
          PY
      - name: Commit only if this isolated branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then exit 0; fi
          test "$(git ls-remote origin "refs/heads/$WORK_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'refactor(admin): use independent product terminology and regenerate assets'
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$WORK_BRANCH"
