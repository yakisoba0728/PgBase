name: Apply reviewed history fixture patch

# Temporary exact-blob data transformation. No repository code, dependencies,
# actions, hooks or downloaded scripts execute with the write token.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/refactor-fixture-patch.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/independent-platform-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Apply the exact reviewed assertion change to the isolated branch
        shell: python
        run: |
          import base64, json, os, urllib.request
          repo = os.environ['REPOSITORY']
          if repo != 'yakisoba0728/PgBase':
              raise SystemExit('Unexpected repository')
          branch = 'refactor/independent-platform-20261116'
          head = os.environ['EXPECTED_HEAD']
          def api(path, method='GET', body=None):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}',
                  data=None if body is None else json.dumps(body).encode(),
                  method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          if api('git/ref/heads/' + branch)['object']['sha'] != head:
              raise SystemExit('Branch moved; refuse patch')
          path = 'pgbase/app_integration_test.go'
          file = api(f'contents/{path}?ref={head}')
          if file['sha'] != 'e17f4ef77f0109366780c5123664c851a799abac':
              print('Reviewed source blob is no longer present; no write')
              raise SystemExit(0)
          source = base64.b64decode(file['content']).decode()
          start = source.index('func TestPublicIdentityArtifactStartsOnlyOnCompleteHistory(')
          end = source.index('\nfunc TestNewAutoMigratePreflightsBeforeAndAfterMigrationsWithOneCache(', start)
          section = source[start:end]
          old = 'if closeErr := app.Close(context.Background()); closeErr != nil {\n\t\t\t\t\tt.Fatal(closeErr)\n\t\t\t\t}'
          new = '// A heartbeat may independently detect the deliberately removed\n\t\t\t\t// history. Accept only that exact failure, never other joined errors.\n\t\t\t\tif closeErr := app.Close(context.Background()); !onlyInjectedMembershipDrift(closeErr) {\n\t\t\t\t\tt.Fatal(closeErr)\n\t\t\t\t}'
          if section.count(old) != 1:
              raise SystemExit('Unexpected assertion shape')
          content = source[:start] + section.replace(old, new) + source[end:]
          base = api('git/commits/' + head)
          tree = api('git/trees', 'POST', {'base_tree': base['tree']['sha'], 'tree': [{'path': path, 'mode': '100644', 'type': 'blob', 'content': content}]})
          commit = api('git/commits', 'POST', {'message': 'test: accept only deliberately injected history drift on shutdown', 'tree': tree['sha'], 'parents': [head]})
          # A sibling update is non-fast-forward and is rejected atomically.
          api('git/refs/heads/' + branch, 'PATCH', {'sha': commit['sha'], 'force': False})
          print('Applied single-file reviewed patch at ' + commit['sha'])
