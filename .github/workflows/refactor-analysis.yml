name: Refactor diagnostic evidence

on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: refactor-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  images:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/independent-platform-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.11
          cache: true
      - name: Verify image contracts repeatedly with race detection
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/filestore -run 'Image|Thumbnail|Variant|WebP|GIF' -count=5 -v > image-tests.log 2>&1
          tail -n 8 image-tests.log
      - name: Compare exact baseline and candidate on the same runner
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/image-baseline" 8f551de4423a6b64d9c0ac94fff9b9bd07264f2a
          cp internal/filestore/image_pipeline_benchmark_test.go "$RUNNER_TEMP/image-baseline/internal/filestore/"
          go version > image-environment.txt
          lscpu >> image-environment.txt
          (cd "$RUNNER_TEMP/image-baseline" && go test ./internal/filestore -run '^$' -bench '^BenchmarkThumbnailBytePipeline$' -benchmem -benchtime=300ms -count=5) | tee image-baseline.txt
          go test ./internal/filestore -run '^$' -bench '^BenchmarkThumbnailBytePipeline$' -benchmem -benchtime=300ms -count=5 | tee image-candidate.txt
      - name: Exercise compression negotiation fuzz invariant
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/api -run '^$' -fuzz '^FuzzAcceptsGzipExplicitRefusal$' -fuzztime=20s -parallel=2 | tee compression-fuzz.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-regression-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            image-*.txt
            image-tests.log
            compression-fuzz.txt
          retention-days: 14
  full-suite-diagnostics:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/independent-platform-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Summarize manual validation without emitting credentials or control sequences
        shell: python
        run: |
          import json, os, re, subprocess
          repo = os.environ['REPOSITORY']
          def api(path):
              raw = subprocess.check_output(['gh', 'api', '--allow-escape-sequences', f'repos/{repo}/{path}'], text=True)
              return re.sub(r'\x1b(?:\[[0-?]*[ -/]*[@-~]|\][^\x07]*(?:\x07|\x1b\\))', '', raw)
          runs = json.loads(api('actions/runs?event=workflow_dispatch&branch=refactor%2Findependent-platform-20261116&per_page=10'))['workflow_runs']
          for run in runs:
              print(json.dumps({k: run.get(k) for k in ('id', 'name', 'head_sha', 'status', 'conclusion', 'html_url')}), flush=True)
              jobs = json.loads(api(f"actions/runs/{run['id']}/jobs?per_page=100"))['jobs']
              for job in jobs:
                  print(json.dumps({k: job.get(k) for k in ('id', 'name', 'status', 'conclusion')}), flush=True)
                  if job['conclusion'] != 'failure':
                      continue
                  lines = api(f"actions/jobs/{job['id']}/logs").splitlines()
                  selected = set()
                  for i, line in enumerate(lines):
                      if re.search(r'--- FAIL:|Error:|Error Trace:|FAIL\s+github|##\[error\]|AssertionError|panic:|expected .* got|Error: expect', line):
                          selected.update(range(max(0, i-2), min(len(lines), i+14)))
                  for i in sorted(selected)[:240]:
                      line = lines[i]
                      line = re.sub(r'(?i)(password|token|secret|authorization)([=:]\s*)\S+', r'\1\2[redacted]', line)
                      line = re.sub(r'postgres(?:ql)?://[^\s]+', '[redacted database URL]', line)
                      print(''.join(c for c in line[:1500] if c.isprintable() or c == '\t'))
