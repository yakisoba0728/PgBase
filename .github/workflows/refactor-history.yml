name: History drift regression evidence

on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: history-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  history:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/independent-platform-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.11
          cache: true
      - name: Verify drift semantics repeatedly without suppressing other errors
        env:
          PORT: ${{ job.services.postgres.ports['5432'] }}
        shell: bash
        run: |
          set -euo pipefail
          export PGBASE_TEST_ADMIN_URL="postgres://postgres:postgres@127.0.0.1:$PORT/postgres?sslmode=disable"
          go test -race ./pgbase -run '^TestInjectedHistoryDriftDoesNotMaskOtherShutdownFailures$' -count=30
          go test -race -tags=integration ./pgbase -run '^TestPublicIdentityArtifactStartsOnlyOnCompleteHistory$/latest_accepted$' -count=30 -timeout=8m -v | tee history-drift.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: history-drift-${{ github.event.pull_request.head.sha }}
          path: history-drift.log
          retention-days: 14
