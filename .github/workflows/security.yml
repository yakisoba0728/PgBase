name: Security and supply chain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_image:
        description: Optional digest-pinned release candidate; empty keeps local CI mode
        required: false
        default: ""
        type: string
      expected_version:
        description: Required with candidate_image
        required: false
        default: ""
        type: string
      source_commit:
        description: Optional immutable source commit corresponding to the candidate
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  packages: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha == vars.PGBASE_CI_TRUSTED_SHA) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && vars.PGBASE_CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 40
    env:
      PGBASE_SECURITY_CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
      PGBASE_SECURITY_EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      # Early release phases predate the owned Trivy allowlist, but their Go
      # and npm dependency scans must still run against their own source. Bring
      # in only the current gate policy beside that source for the image scan.
      - name: Check out current release security policy
        if: inputs.source_commit != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-gate-policy

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: ${{ vars.PGBASE_CI_RUNNER == '' }}

      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: ${{ vars.PGBASE_CI_RUNNER == '' && 'npm' || '' }}
          cache-dependency-path: ui/admin/package-lock.json

      - name: Audit pinned frontend dependencies
        working-directory: ui/admin
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Select the image under test
        id: image
        if: inputs.candidate_image != '' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PGBASE_SECURITY_CANDIDATE_IMAGE" && -z "$PGBASE_SECURITY_EXPECTED_VERSION" ]]; then
            # Run-scoped so a job sharing the Docker daemon cannot retag it.
            echo "image_ref=pgbase:audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            scripts/support/validate-release-candidate.sh \
              "$PGBASE_SECURITY_CANDIDATE_IMAGE" "$PGBASE_SECURITY_EXPECTED_VERSION"
            echo "image_ref=$PGBASE_SECURITY_CANDIDATE_IMAGE" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate and pull release candidate
        if: steps.image.outputs.release == 'true'
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$PGBASE_SECURITY_CANDIDATE_IMAGE"

      - name: Build the production image in local CI mode
        if: steps.image.outputs.release == 'false'
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: docker build --file deployments/Dockerfile --tag "$IMAGE_REF" .

      - name: Generate SPDX SBOM
        if: steps.image.outputs.image_ref != ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.image_ref }}
          format: spdx-json
          output-file: pgbase.spdx.json
          artifact-name: pgbase-sbom

      # The findings are recorded before the gate runs, so a failing scan still
      # leaves a machine-readable report to triage rather than only console
      # output in a red job.
      - name: Record image findings as SARIF
        if: steps.image.outputs.image_ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: sarif
          output: pgbase-image.sarif
          exit-code: "0"
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          trivyignores: ${{ inputs.source_commit != '' && '.release-gate-policy/deployments/security/trivy-allowlist.yaml' || 'deployments/security/trivy-allowlist.yaml' }}

      # The gate only judges HIGH and CRITICAL, but a full-severity record is
      # what lets someone see a MEDIUM becoming a HIGH between releases rather
      # than discovering it the day it breaks the build.
      - name: Record every severity as SARIF
        if: steps.image.outputs.image_ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: sarif
          output: pgbase-image-all-severities.sarif
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          trivyignores: ${{ inputs.source_commit != '' && '.release-gate-policy/deployments/security/trivy-allowlist.yaml' || 'deployments/security/trivy-allowlist.yaml' }}

      - name: Upload image scan SARIF
        if: ${{ always() && steps.image.outputs.image_ref != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pgbase-image-scan-sarif
          path: |
            pgbase-image.sarif
            pgbase-image-all-severities.sarif
          if-no-files-found: warn
          retention-days: 90

      # There is no blanket exemption for unfixed findings: an unfixed HIGH or
      # CRITICAL is still something an operator would ship, so the scan fails
      # unless a dated, owned allowlist entry accepts that advisory by name.
      - name: Scan production image
        if: steps.image.outputs.image_ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: ${{ inputs.source_commit != '' && '.release-gate-policy/deployments/security/trivy-allowlist.yaml' || 'deployments/security/trivy-allowlist.yaml' }}
