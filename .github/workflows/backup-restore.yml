name: Backup restore drill

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_image:
        description: Optional digest-pinned release candidate; empty keeps local and scheduled modes
        required: false
        default: ""
        type: string
      expected_version:
        description: Required with candidate_image
        required: false
        default: ""
        type: string
      source_commit:
        description: Optional immutable source commit corresponding to the candidate
        required: false
        default: ""
        type: string
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read
  packages: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PGBASE_RESTORE_CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
      PGBASE_RESTORE_EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The restore drill is a release-gate harness and can postdate the
          # candidate it exercises. The candidate itself stays digest-pinned.
          ref: ${{ github.sha }}
          # Source-only upgrade acceptance archives a pinned historical commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: true
          cache-dependency-path: go.sum

      # The drill refuses a candidate that is not digest-pinned, so this only
      # has to make the registry reachable before it runs.
      - name: Authenticate to the registry for a release candidate
        if: inputs.candidate_image != ''
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/support/validate-release-candidate.sh \
            "$PGBASE_RESTORE_CANDIDATE_IMAGE" "$PGBASE_RESTORE_EXPECTED_VERSION"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The drill owns its PostgreSQL 16/17/18 containers so the release
      # candidate and the scheduled run restore and start the same artifact on
      # every supported major.
      - name: Run the restore drill
        shell: bash
        run: |
          set -o pipefail
          go test -tags=restore ./tests/restore -v -count=1 -timeout 40m 2>&1 | tee restore-drill.log

      # Historical source compatibility is distinct from the candidate-image
      # restore gate. It builds a pinned old commit, upgrades a populated
      # fixture, then restores the pre-upgrade recovery set for rollback.
      - name: Run the historical source upgrade and rollback drill
        if: inputs.candidate_image == ''
        shell: bash
        run: |
          set -o pipefail
          go test -tags='restore upgrade' ./tests/restore \
            -run '^TestHistoricalUpgradeAndRollback$' -v -count=1 -timeout 20m \
            2>&1 | tee historical-upgrade-drill.log

      - name: Upload restore drill log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-drill-${{ inputs.expected_version || github.run_id }}
          path: |
            restore-drill.log
            historical-upgrade-drill.log
          if-no-files-found: warn
          retention-days: 30
