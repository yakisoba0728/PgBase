name: End to end

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.7
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json

      - name: Generate isolated Compose configuration
        shell: bash
        run: |
          echo "COMPOSE_PROJECT_NAME=pgbase-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "PGBASE_IMAGE=pgbase-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "PGBASE_HTTP_PORT=18090" >> "$GITHUB_ENV"
          echo "PGBASE_POSTGRES_PORT=15432" >> "$GITHUB_ENV"
          echo "PGBASE_PUBLIC_URL=http://127.0.0.1:18090" >> "$GITHUB_ENV"
          echo "PGBASE_POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PGBASE_SETUP_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PGBASE_TOKEN_SECRET=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Build image
        run: docker compose -f deployments/docker-compose.yml build

      - name: Start isolated PostgreSQL 16.13 project
        run: docker compose -f deployments/docker-compose.yml up -d --wait

      - name: Install browser test dependencies
        working-directory: ui/admin
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify empty-database browser onboarding
        working-directory: ui/admin
        env:
          PGBASE_BROWSER_BASE_URL: http://127.0.0.1:18090
        run: npm run test:e2e

      - name: Verify hardened runtime
        shell: bash
        run: |
          container_id="$(docker compose -f deployments/docker-compose.yml ps -q pgbase)"
          test -n "$container_id"
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "nonroot:nonroot"
          if docker run --rm --entrypoint /bin/sh "$PGBASE_IMAGE" -c true; then
            echo "image unexpectedly contains a shell" >&2
            exit 1
          fi

      - name: Run black-box tests
        shell: bash
        run: |
          set -o pipefail
          go test -tags=e2e ./tests/e2e -v -count=2 -shuffle=on 2>&1 | tee e2e.log

      - name: Capture service logs
        if: failure()
        run: docker compose -f deployments/docker-compose.yml logs --no-color > compose.log 2>&1

      - name: Upload failed E2E logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-logs
          path: |
            e2e.log
            compose.log
          if-no-files-found: warn
          retention-days: 14

      - name: Remove isolated Compose resources
        if: always()
        run: docker compose -f deployments/docker-compose.yml down --volumes --remove-orphans --rmi local
