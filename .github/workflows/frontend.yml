name: Frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_image:
        description: Optional digest-pinned candidate supplied by the release gate
        required: false
        default: ""
        type: string
      expected_version:
        description: Canonical version paired with candidate_image
        required: false
        default: ""
        type: string
      source_commit:
        description: Optional immutable source commit corresponding to the candidate
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha == vars.PGBASE_CI_TRUSTED_SHA) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && vars.PGBASE_CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Validate release candidate binding
        if: inputs.candidate_image != ''
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: scripts/support/validate-release-candidate.sh "$CANDIDATE_IMAGE" "$EXPECTED_VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: ${{ vars.PGBASE_CI_RUNNER == '' && 'npm' || '' }}
          cache-dependency-path: ui/admin/package-lock.json

      - name: Install dependencies
        working-directory: ui/admin
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: ui/admin
        run: npm run typecheck

      - name: Test
        working-directory: ui/admin
        run: npm test

      # Building over the committed output would hide a file that the current
      # source no longer produces, so the gate compares against a clean build.
      - name: Rebuild the embedded administrator UI from an empty directory
        working-directory: ui/admin
        run: |
          rm -rf dist
          npm run build

      - name: Verify the committed embedded output reproduces exactly
        shell: bash
        run: |
          set -euo pipefail
          divergence="$(git status --porcelain --untracked-files=all -- ui/admin/dist)"
          if [[ -n "$divergence" ]]; then
            echo "committed ui/admin/dist does not match a clean build:" >&2
            printf '%s\n' "$divergence" >&2
            git diff -- ui/admin/dist >&2 || true
            exit 1
          fi
