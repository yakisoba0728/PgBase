name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go / PostgreSQL ${{ matrix.postgres.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - version: "16.13"
            image: postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
          - version: "17"
            image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
          - version: "18"
            image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGBASE_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.7
          cache: true
          cache-dependency-path: go.sum

      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        shell: bash
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee go-test.log

      - name: Record benchmark baseline
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/query -run '^$' -bench . -benchmem 2>&1 | tee benchmark.txt

      - name: Upload benchmark baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-postgresql-${{ matrix.postgres.version }}
          path: benchmark.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed backend logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-failure-postgresql-${{ matrix.postgres.version }}
          path: go-test.log
          if-no-files-found: warn
          retention-days: 14
