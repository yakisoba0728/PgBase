name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_image:
        description: Optional digest-pinned candidate supplied by the release gate
        required: false
        default: ""
        type: string
      expected_version:
        description: Canonical version paired with candidate_image
        required: false
        default: ""
        type: string
      source_commit:
        description: Optional immutable source commit corresponding to the candidate
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  observability-artifacts:
    name: Observability artifacts
    # A repository-scoped runner is selected for an exact internal PR or a
    # protected main push. Releases, manual runs, schedules, and fork PRs stay
    # on GitHub-hosted runners, where publication credentials cannot leak to a
    # developer machine.
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha == vars.PGBASE_CI_TRUSTED_SHA) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && vars.PGBASE_CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historical phase sources predate this observability harness. This
          # image-independent policy job belongs to the gate definition.
          ref: ${{ github.sha }}

      - name: Validate Grafana dashboard JSON
        run: jq empty deployments/observability/grafana-dashboard.json

      - name: Validate Prometheus alert rules
        run: >-
          docker run --rm --entrypoint=/bin/promtool
          -v "$PWD/deployments/observability:/rules:ro"
          prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
          check rules /rules/prometheus-alerts.yml

      - name: Validate dashboard PromQL
        run: scripts/support/check-dashboard-promql.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: ${{ vars.PGBASE_CI_RUNNER == '' }}
          cache-dependency-path: go.sum

      # Parsing proves the queries are well formed; only the exposition golden
      # proves they select a series pgBase actually publishes.
      - name: Validate dashboard and alert metric contract
        run: go test ./tests/observability -count=1

  unit:
    name: Go unit
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha == vars.PGBASE_CI_TRUSTED_SHA) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && vars.PGBASE_CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      # The same tiering as PostgreSQL integration: fast PR feedback still
      # exercises every unit test, while main, release-gate and manual runs
      # retain race detection over the complete package graph.
      PGBASE_FULL_UNIT_RACE: ${{ github.event_name != 'pull_request' || inputs.candidate_image != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Validate release candidate binding
        if: inputs.candidate_image != ''
        env:
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: scripts/support/validate-release-candidate.sh "$CANDIDATE_IMAGE" "$EXPECTED_VERSION"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: ${{ vars.PGBASE_CI_RUNNER == '' }}
          cache-dependency-path: go.sum

      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run pinned blocking static analysis
        run: scripts/lint-go.sh

      - name: Vet unit build
        run: go vet ./...

      - name: Test unit suite with skip policy
        shell: bash
        run: |
          test_arguments=(-count=1)
          if [[ "$PGBASE_FULL_UNIT_RACE" == "true" ]]; then
            test_arguments=(-race "${test_arguments[@]}")
          fi
          scripts/test-go-unit.sh "${test_arguments[@]}"

      - name: Install the pinned private attestation verifier
        if: inputs.source_commit == ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Verify private attestations against a disposable registry
        if: inputs.source_commit == ''
        run: go test -tags=cosignintegration ./tests/release -run '^TestPrivateReleaseAttestation' -count=1

  # The terminal adapter's cancellation and echo-restoration behaviour is
  # implemented per platform and its tests are darwin-only, so the Ubuntu unit
  # job never compiles them. Without a macOS runner a regression in the path
  # that restores a terminal after an interrupted password prompt would ship
  # unnoticed.
  darwin-terminal:
    name: macOS terminal
    if: inputs.candidate_image != '' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: true
          cache-dependency-path: go.sum

      - name: Vet the darwin build
        run: go vet ./internal/cli/...

      # Named explicitly rather than run as the whole package: this job exists
      # for the tests the Linux job cannot compile, and naming them makes it
      # fail loudly if the darwin file is renamed or its build tag drifts.
      - name: Test the darwin terminal adapter with the race detector
        run: |
          go test -race -count=1 -v ./internal/cli \
            -run 'TestReadTerminalPasswordContextCancellationRestoresPTY'

  # Replacement, launcher and executable-lock behavior is implemented with
  # Windows APIs and cannot be compiled or exercised by the Ubuntu unit job.
  # Keep this bounded source check on main and explicit manual runs;
  # it is intentionally outside routine pull-request feedback and image gates.
  windows-self-update:
    name: Windows self-update
    if: inputs.candidate_image == '' && inputs.source_commit == '' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: true
          cache-dependency-path: go.sum

      - name: Test native Windows self-update and CLI integration
        run: go test -count=1 ./internal/selfupdate ./internal/cli

  integration:
    name: PostgreSQL integration / ${{ matrix.postgres.version }}
    runs-on: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha == vars.PGBASE_CI_TRUSTED_SHA) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && vars.PGBASE_CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Routine PRs and main pushes cover the middle supported major. The
        # digest-pinned release gate and explicit manual runs retain the full
        # 16/17/18 compatibility matrix.
        postgres: ${{ fromJSON((inputs.candidate_image != '' || github.event_name == 'workflow_dispatch') && '[{"version":"16.13","image":"postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60"},{"version":"17.9","image":"postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641"},{"version":"18.3","image":"postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba"}]' || '[{"version":"17.9","image":"postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641"}]') }}
    # The repository-scoped runners share one Docker daemon and loopback
    # interface, so every Docker resource this job creates is job-scoped: the
    # PostgreSQL service publishes on a Docker-assigned host port, and the S3
    # fixture runs as its own Compose project on an ephemeral port. A fixed
    # host port or project name lets a concurrent job fail to bind, or tear
    # down this job's fixture mid-run.
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGBASE_TEST_S3_PROJECT: pgbase-ci-files-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
      PGBASE_TEST_S3_HOST_PORT: "0"
      # Unit tests always use -race. Re-running the full PostgreSQL suite with
      # it on every PR dominated feedback time (15m21s in run 34428905056), so
      # retain that expensive coverage for main, release-gate and manual runs.
      # PRs run a representative database smoke set; the whole package graph
      # stays mandatory on main, release-gate and manual runs. The race detector
      # checks Go code, not the database major, so the 16/17/18 matrix runs it
      # on 17.9 only; under -race the suite took 24m and timed out on 16/18.
      PGBASE_FULL_INTEGRATION_RACE: ${{ (github.event_name != 'pull_request' || inputs.candidate_image != '') && matrix.postgres.version == '17.9' }}
      PGBASE_INTEGRATION_PACKAGES: ${{ github.event_name == 'pull_request' && './internal/migrate ./internal/sqlconsole ./internal/filestore ./internal/userauth ./pgbase' || './...' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      # The job context, which carries the assigned host port, is only
      # available to steps.
      - name: Resolve the job-scoped PostgreSQL endpoint
        env:
          POSTGRES_HOST_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: >-
          echo "PGBASE_TEST_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:${POSTGRES_HOST_PORT:?}/postgres?sslmode=disable"
          >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: ${{ vars.PGBASE_CI_RUNNER == '' }}
          cache-dependency-path: go.sum

      # The integration suite executes the SDK's live HTTP conformance runner,
      # including the Dart client declared with sdk ^3.13.0.
      - name: Set up Dart for SDK conformance
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.3

      - name: Provision matching PostgreSQL client tools
        shell: bash
        env:
          POSTGRES_IMAGE: ${{ matrix.postgres.image }}
        run: |
          tools_directory="$RUNNER_TEMP/pgbase-postgres-tools"
          scripts/install-test-pg-tools.sh "$tools_directory"
          echo "$tools_directory" >> "$GITHUB_PATH"
          echo "TEST_PGBASE_POSTGRES_IMAGE=$POSTGRES_IMAGE" >> "$GITHUB_ENV"

      - name: Vet integration build
        if: env.PGBASE_FULL_INTEGRATION_RACE == 'true'
        run: go vet -tags=integration ./...

      # The S3 fixture image is built from pinned MinIO source
      # (tests/filestore/Dockerfile), which takes about four minutes cold.
      # Self-hosted runners keep the image in their Docker daemon; hosted
      # runners carry it between runs in the Actions cache instead.
      - name: Restore cached S3 fixture image
        id: s3-fixture-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pgbase-test-s3-image.tar
          key: pgbase-test-s3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/filestore/Dockerfile') }}

      - name: Load cached S3 fixture image
        if: steps.s3-fixture-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/pgbase-test-s3-image.tar"

      - name: Start local S3 integration fixture
        id: s3-fixture
        run: scripts/test-s3-fixture.sh up >> "$GITHUB_OUTPUT"

      - name: Export S3 fixture image for the cache
        if: runner.environment == 'github-hosted' && steps.s3-fixture-cache.outputs.cache-hit != 'true'
        run: >-
          docker save --output "$RUNNER_TEMP/pgbase-test-s3-image.tar"
          "$(docker compose --file tests/filestore/compose.yaml config --images | sort -u)"

      - name: Test PostgreSQL integration suite with skip policy
        shell: bash
        env:
          PGBASE_TEST_S3_ENDPOINT: ${{ steps.s3-fixture.outputs.PGBASE_TEST_S3_ENDPOINT }}
        run: |
          set -o pipefail
          test_arguments=(-count=1)
          if [[ "$PGBASE_FULL_INTEGRATION_RACE" == "true" ]]; then
            # ./pgbase alone takes over 8 minutes under -race, close to go test's
            # 10-minute default per package.
            test_arguments=(-race -timeout 20m "${test_arguments[@]}")
          fi
          scripts/test-go-integration.sh "${test_arguments[@]}" 2>&1 | tee go-test.log

      # This starts two real server child processes and performs a bounded
      # kill/restart workload. Run it once on main or explicit
      # manual validation, on the routine PostgreSQL 17 matrix entry only.
      - name: Test bounded multi-process durability
        if: inputs.candidate_image == '' && inputs.source_commit == '' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && matrix.postgres.version == '17.9'
        run: >-
          go test -tags='integration multiprocess' ./pgbase
          -run '^TestMultiProcessBoundedFailureAcceptance$' -count=1 -v

      - name: Set up Node for live SDK conformance
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Install and verify TypeScript SDK against PgBase
        run: |
          npm --prefix sdk/typescript ci
          npm --prefix sdk/typescript test
          go test -tags='integration sdkconformance' ./pgbase -run '^TestSDKPublicRecordHTTPConformance$' -count=1

      - name: Verify browser SDK example modules
        if: inputs.source_commit == ''
        run: npm --prefix examples/user-notes test

      - name: Test administrator SDKs against a real server
        if: inputs.candidate_image == '' && inputs.source_commit == '' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && matrix.postgres.version == '17.9'
        run: >-
          go test -tags='integration multiprocess' ./pgbase
          -run '^TestAdministrationSDKsAgainstRealHTTPServer$' -count=1 -v -timeout 8m

      - name: Stop local S3 integration fixture
        if: always()
        run: scripts/test-s3-fixture.sh down

      - name: Record benchmark baseline
        if: inputs.candidate_image != '' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          go test -tags=integration ./internal/query ./internal/observability -run '^$' -bench . -benchmem 2>&1 | tee benchmark.txt

      - name: Upload benchmark baseline
        if: ${{ always() && (inputs.candidate_image != '' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-postgresql-${{ matrix.postgres.version }}
          path: benchmark.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed backend logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-failure-postgresql-${{ matrix.postgres.version }}
          path: go-test.log
          if-no-files-found: warn
          retention-days: 14

  release-phase-artifacts:
    name: Release phase artifacts
    # A phase-image dispatch already selected one historical source commit.
    # Recursively rebuilding every phase from that checkout is both redundant
    # and impossible for commits that predate the manifest and builder.
    if: inputs.source_commit == '' && (inputs.candidate_image != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGBASE_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out repository with release artifact sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
          cache: true
          cache-dependency-path: go.sum

      - name: Build immutable release phases
        env:
          PGBASE_MEMBERSHIP_RELEASE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/release-phase-artifacts
        run: |
          scripts/support/build-release-phase-artifacts.sh record-membership-v7 \
            "$PGBASE_MEMBERSHIP_RELEASE_ARTIFACT_DIRECTORY"
          scripts/support/build-release-phase-artifacts.sh schema-compiler-v9 \
            "$PGBASE_MEMBERSHIP_RELEASE_ARTIFACT_DIRECTORY"

      - name: Run the process rollout against the built artifacts
        env:
          PGBASE_MEMBERSHIP_RELEASE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/release-phase-artifacts
          PGBASE_SCHEMA_COMPILER_RELEASE_ARTIFACT_DIRECTORY: ${{ runner.temp }}/release-phase-artifacts
        run: go test -race -tags='integration releaseartifacts' ./tests/release -count=1

      # upload-artifact does not preserve executable mode bits. The tarball is
      # the transport artifact so downloaded phase binaries remain runnable.
      - name: Pack immutable release phase artifacts
        shell: bash
        run: >-
          tar --create --gzip
          --file "$RUNNER_TEMP/release-phase-artifacts.tar.gz"
          --directory "$RUNNER_TEMP/release-phase-artifacts" .

      - name: Upload immutable release phase artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-phase-artifacts
          path: ${{ runner.temp }}/release-phase-artifacts.tar.gz
          if-no-files-found: error
          retention-days: 90
