name: Query load qualification

# Explicit, read-only qualification against an ephemeral database. No external
# database URL, production secrets, deployment or publication is accepted.
on:
  workflow_dispatch:
    inputs:
      rows:
        description: Synthetic record count
        type: choice
        options: ['10000', '100000', '500000', '1000000']
        default: '500000'
      operations:
        description: Measured operations per workload/concurrency pair
        type: choice
        options: ['1000', '5000']
        default: '1000'
permissions:
  contents: read
concurrency:
  group: query-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  query-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Measure the bounded query-service workload
        env:
          PORT: ${{ job.services.postgres.ports['5432'] }}
          PGBASE_BENCH_ROWS: ${{ inputs.rows }}
          OPERATIONS: ${{ inputs.operations }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PGBASE_BENCH_ROWS" in 10000|100000|500000|1000000) ;; *) exit 2 ;; esac
          case "$OPERATIONS" in 1000|5000) ;; *) exit 2 ;; esac
          export PGBASE_TEST_ADMIN_URL="postgres://postgres:postgres@127.0.0.1:$PORT/postgres?sslmode=disable"
          git rev-parse HEAD > load-environment.txt
          go version >> load-environment.txt
          lscpu >> load-environment.txt
          printf 'rows=%s operations-per-case=%s\n' "$PGBASE_BENCH_ROWS" "$OPERATIONS" >> load-environment.txt
          go test -tags=integration ./internal/query -run '^$' -bench '^BenchmarkConcurrentRecordReads$' -benchtime="${OPERATIONS}x" -count=1 -timeout=15m | tee query-load.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: query-load-${{ github.sha }}-${{ inputs.rows }}
          path: |
            load-environment.txt
            query-load.txt
          retention-days: 14
