name: Refactor offline tooling

# Temporary, branch-scoped toolchain transport. Capture public dependencies
# only; never copy credentials, environment files, .git, or npm configuration.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/refactor-toolchain.yml]

permissions:
  contents: read

jobs:
  language-tooling:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/independent-platform-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.11
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json
      - name: Fetch and verify locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          npm --prefix ui/admin ci --ignore-scripts
          npm --prefix sdk/typescript ci --ignore-scripts
          while IFS= read -r -d '' lock; do
            npm --prefix "$(dirname "$lock")" ci --ignore-scripts
          done < <(find examples -name package-lock.json -not -path '*/node_modules/*' -print0)
      - name: Package offline tools and content-addressed dependency caches
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pgbase-tools"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-commit.txt"
          go version > "$out/versions.txt"
          node --version >> "$out/versions.txt"
          tar -czf "$out/go.tar.gz" -C "$(go env GOROOT)" .
          tar -czf "$out/go-modules.tar.gz" -C "$(go env GOMODCACHE)" .
          tar -czf "$out/node.tar.gz" -C "$(dirname "$(dirname "$(command -v node)")")" .
          tar -czf "$out/npm-content-cache.tar.gz" -C "$HOME/.npm" _cacache
          cd "$out"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refactor-language-tooling
          path: ${{ runner.temp }}/pgbase-tools/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  postgres-tooling:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/independent-platform-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Package the same pinned PostgreSQL runtime as integration CI
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pgbase-postgres"
          mkdir -p "$out"
          docker run --rm --entrypoint bash -v "$out:/out" \
            postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641 \
            -c 'set -euo pipefail
                mapfile -t libs < <(ldd /usr/lib/postgresql/17/bin/* /usr/lib/postgresql/17/lib/*.so 2>/dev/null | awk '\''$2 == "=>" && $3 ~ /^\// {print $3}'\'' | sort -u | grep -vE '\''/(ld-linux|libc\.so|libm\.so|libpthread\.so|libdl\.so|librt\.so)'\'' || true)
                tar --dereference -czf /out/postgres.tar.gz /usr/lib/postgresql/17 /usr/share/postgresql/17 "${libs[@]}"
                /usr/lib/postgresql/17/bin/postgres --version > /out/version.txt'
          cd "$out"
          sha256sum postgres.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refactor-postgres-tooling
          path: ${{ runner.temp }}/pgbase-postgres/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
