name: Release signed image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.ref_protected }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      expected_version: ${{ steps.policy.outputs.expected_version }}
      channel: ${{ steps.policy.outputs.channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate canonical release tag and version
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          scripts/support/release-tag-policy.sh "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" | tee "$GITHUB_OUTPUT"

  candidate:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-publish
    permissions:
      contents: read
      packages: write
    outputs:
      candidate_image: ${{ steps.candidate.outputs.candidate_image }}
      expected_version: ${{ needs.preflight.outputs.expected_version }}
      image: ${{ steps.candidate.outputs.image }}
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned private attestation verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Require a private package before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/support/validate-private-package.sh before \
            "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REPOSITORY#*/}" \
            "$RUNNER_TEMP/package-privacy-before.json"

      - name: Build and push candidate once
        id: candidate
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.expected_version }}
        run: |
          set -euo pipefail
          image="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          release_version="$EXPECTED_VERSION"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          metadata_file="$RUNNER_TEMP/candidate-metadata.json"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create \
            --use \
            --name pgbase-release \
            --driver docker-container \
            --driver-opt "image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8"
          docker buildx build \
            --file deployments/Dockerfile \
            --platform linux/amd64 \
            --build-arg "VERSION=$release_version" \
            --build-arg "SOURCE_COMMIT=$GITHUB_SHA" \
            --build-arg "BUILT_AT=$built_at" \
            --tag "$image:$candidate_tag" \
            --metadata-file "$metadata_file" \
            --provenance=mode=max \
            --sbom=true \
            --push .
          digest="$(jq --exit-status --raw-output \
            '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata_file")"
          candidate_image="$image@$digest"
          scripts/support/validate-release-candidate.sh "$candidate_image" "$release_version"
          {
            echo "candidate_image=$candidate_image"
            echo "image=$image"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Generate candidate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.candidate.outputs.candidate_image }}
          format: spdx-json
          output-file: pgbase-release.spdx.json
          artifact-name: pgbase-release-sbom

      - name: Describe the key-backed build
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.expected_version }}
        run: scripts/support/create-release-provenance.sh "$RUNNER_TEMP/release-provenance.json" "$EXPECTED_VERSION" "$GITHUB_SHA"

      - name: Sign the release provenance and SBOM
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.expected_version }}
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.candidate_image }}
        run: |
          scripts/support/sign-release-attestation.sh "$CANDIDATE_IMAGE" slsaprovenance1 "$RUNNER_TEMP/release-provenance.json"
          scripts/support/sign-release-attestation.sh "$CANDIDATE_IMAGE" spdxjson pgbase-release.spdx.json

      # Producing an attestation is not the same as being able to retrieve and
      # verify one. Every gate and the promotion depend on this job, so a
      # candidate whose provenance or SBOM cannot be verified from the registry
      # never reaches a tag.
      - name: Verify the signed provenance and SBOM against the candidate digest
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.candidate_image }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.expected_version }}
        run: |
          set -euo pipefail
          scripts/support/verify-release-attestation.sh "$CANDIDATE_IMAGE" slsaprovenance1 \
            "$RUNNER_TEMP/release-provenance.json" .github/cosign.pub "$RUNNER_TEMP/attestation-provenance.json"
          scripts/support/verify-release-attestation.sh "$CANDIDATE_IMAGE" spdxjson \
            pgbase-release.spdx.json .github/cosign.pub "$RUNNER_TEMP/attestation-sbom.json"

      - name: Require the published package to remain private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/support/validate-private-package.sh after \
            "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REPOSITORY#*/}" \
            "$RUNNER_TEMP/package-privacy-after.json"

      - name: Upload attestation verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation-verification
          path: |
            ${{ runner.temp }}/attestation-*.json
            ${{ runner.temp }}/package-privacy-*.json
          if-no-files-found: warn
          retention-days: 90

  gate:
    needs: candidate
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read
      packages: read
    with:
      candidate_image: ${{ needs.candidate.outputs.candidate_image }}
      expected_version: ${{ needs.candidate.outputs.expected_version }}

  promotion:
    needs: [preflight, candidate, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publish
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-promotion-${{ needs.preflight.outputs.channel }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Promote the verified digest without rebuilding
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ needs.candidate.outputs.candidate_image }}
          EXPECTED_VERSION: ${{ needs.candidate.outputs.expected_version }}
          CHANNEL_VERSION_OVERRIDE: ${{ vars.PGBASE_RELEASE_CHANNEL_BOOTSTRAP_VERSION }}
        run: |
          set -euo pipefail
          image="${CANDIDATE_IMAGE%@sha256:*}"
          scripts/support/promote-release-image.sh \
            "$image" "$GITHUB_REF_NAME" "$CANDIDATE_IMAGE" "$EXPECTED_VERSION" "$CHANNEL_VERSION_OVERRIDE" \
            2>&1 | tee "$RUNNER_TEMP/release-promotion-audit.txt"

      - name: Upload promotion digest audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-promotion-digests
          path: ${{ runner.temp }}/release-promotion-audit.txt
          if-no-files-found: warn
          retention-days: 90
