name: Digest-pinned release gate

on:
  workflow_call:
    inputs:
      candidate_image:
        description: Digest-pinned candidate image
        required: true
        type: string
      expected_version:
        description: Canonical release version
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject a mutable or malformed candidate
        run: scripts/support/validate-release-candidate.sh "${{ inputs.candidate_image }}" "${{ inputs.expected_version }}"

  backend:
    needs: contract
    uses: ./.github/workflows/backend.yml

  frontend:
    needs: contract
    uses: ./.github/workflows/frontend.yml

  e2e:
    needs: contract
    uses: ./.github/workflows/e2e.yml
    with:
      candidate_image: ${{ inputs.candidate_image }}
      expected_version: ${{ inputs.expected_version }}

  security:
    needs: contract
    uses: ./.github/workflows/security.yml
    with:
      candidate_image: ${{ inputs.candidate_image }}
      expected_version: ${{ inputs.expected_version }}

  backup_restore:
    needs: contract
    uses: ./.github/workflows/backup-restore.yml
    with:
      candidate_image: ${{ inputs.candidate_image }}
      expected_version: ${{ inputs.expected_version }}
